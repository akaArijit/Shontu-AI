# Column aliases for the four InvestWell XLSX/CSV exports.
#
# Header matching ignores case, punctuation and extra spaces.  The importer
# only reads the fields listed below; PAN, Aadhaar, contact, bank, KYC,
# nominee and address columns are ignored and are reported as sensitive.
#
# Nothing here is guessed at runtime: if a required column is not found, the
# preview is blocked with a clear message instead of zero-filling the field.

date_formats:
  - "%d-%m-%Y"
  - "%d/%m/%Y"
  - "%Y-%m-%d"
  - "%d-%b-%Y"
  - "%d %b %Y"
  - "%d-%m-%y"
  - "%d/%m/%y"
  - "%Y/%m/%d"

files:
  clients:
    label: "Client Details"
    required:
      - name
    fields:
      name:
        - "NAME"
        - "CLIENT NAME"
        - "CLIENT"
        - "INVESTOR NAME"
        - "CUSTOMER NAME"
        - "APPLICANT NAME"
      iwell_code:
        - "IWELL CODE"
        - "IWELLCODE"
        - "IWELL CODE NO"
        - "IWELLCODE NO"
        - "IWELL ID"
      iwell_code_2:
        - "IWELL CODE 2"
        - "IWELL CODE2"
        - "IWELLCODE2"
        - "IWELL CODE II"
      app_code:
        - "APPCODE"
        - "APP CODE"
        - "APP CODE NO"
        - "APPLICATION CODE"
      first_investment_date:
        - "FIRST INVESTMENT DATE"
        - "FIRST INV DATE"
        - "FIRST PURCHASE DATE"
        - "DATE OF FIRST INVESTMENT"
      client_aum:
        - "AUM"
        - "TOTAL AUM"
        - "CLIENT AUM"

  folios:
    label: "Folios"
    required:
      - folio_number
      - scheme_name
    fields:
      client_name:
