        - "NAME"
        - "CLIENT"
        - "INVESTOR NAME"
      iwell_code:
        - "IWELL CODE"
        - "IWELLCODE"
        - "IWELL CODE NO"
        - "IWELLCODE NO"
        - "IWELL ID"
      iwell_code_2:
        - "IWELL CODE 2"
        - "IWELL CODE2"
        - "IWELLCODE2"
        - "IWELL CODE II"
      app_code:
        - "APP CODE"
        - "APPCODE"
        - "APPLICATION CODE"
      folio_number:
        - "FOLIO NO"
        - "FOLIO NUMBER"
        - "FOLIO"
        - "FOLIO ID"
        - "ACCOUNT NUMBER"
        - "ACCOUNT NO"
      scheme_name:
        - "SCHEME NAME"
        - "SCHEME"
        - "FUND NAME"
        - "MUTUAL FUND NAME"
        - "PRODUCT NAME"
      folio_type:
        - "FOLIO TYPE"
        - "HOLDING TYPE"
        - "HOLDING NATURE"
        - "MODE OF HOLDING"
