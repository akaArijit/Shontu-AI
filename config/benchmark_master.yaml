# Full NSE India equity benchmark master list.
#
# Names follow the app's existing Total Return Index (TRI) convention and the
# official NSE benchmark-code list (as of 30 September 2026).  Every name here
# is selectable in the Benchmark Data screen even when the user has not imported
# local closing levels for it.  Selecting a benchmark never creates levels and
# never makes a comparison available; missing levels stay "Not available".
#
# The graph only draws benchmarks that are configured keyword rules, imported
# level series, or already mapped to a scheme.  This master list is only the
# dropdown catalogue, so it does not add empty nuclei to the graph.

