# Suggested benchmark categories and automatic keyword rules.
#
# Every automatic mapping starts with status "needs_review". Review and change
# mappings on the app's Benchmark Mapping & Data screen. Reviewed mappings are
# stored in local SQLite and preserved across snapshot imports.
#
# The keyword matching is case-insensitive and handles common variations:
# - "fund" is ignored
# - "&" and "and" are treated equivalently
# - hyphens are treated as spaces
# - word boundaries are respected

