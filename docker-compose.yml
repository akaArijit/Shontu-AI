# MFD Fund Monitoring - Local Development Docker Compose
version: '3.8'

services:
  # PostgreSQL Database (Supabase-compatible)
  postgres:
    image: postgres:15-alpine
    container_name: fund-engine-db
    environment:
      POSTGRES_DB: fund_engine
      POSTGRES_USER: fund_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fund_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fund_user -d fund_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching (optional, for API rate limiting)
  redis:
    image: redis:7-alpine
    container_name: fund-engine-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fund-engine-api
    environment:
      DATABASE_URL: postgresql://fund_user:${DB_PASSWORD:-fund_password}@postgres:5432/fund_engine
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCORING_CONFIG_PATH: /app/config/scoring_config.yaml
      RULES_CONFIG_PATH: /app/config/rules.yaml
      BENCHMARK_MAPPINGS_PATH: /app/config/explicit_benchmark_mappings.json
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Batch Job Runner (runs nightly)
  batch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fund-engine-batch
    environment:
      DATABASE_URL: postgresql://fund_user:${DB_PASSWORD:-fund_password}@postgres:5432/fund_engine
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCORING_CONFIG_PATH: /app/config/scoring_config.yaml
      RULES_CONFIG_PATH: /app/config/rules.yaml
      BENCHMARK_MAPPINGS_PATH: /app/config/explicit_benchmark_mappings.json
    entrypoint: ["python", "scripts/run_nightly.py"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    # Run on schedule via external cron (e.g., Render Cron Jobs, Kubernetes CronJob)
    # For local testing: docker-compose run --rm batch --date 2024-01-15

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: fund-engine-network