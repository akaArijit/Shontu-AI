# Fund Engine - local backend stack (Postgres + API + batch)
# The Next.js dashboard runs on the host: npm run dev (http://localhost:3000)
#
#   docker compose up -d postgres
#   docker compose up -d api             # optional, containerised API
#   docker compose run --rm batch        # one pipeline run
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fund-engine-db
    environment:
      POSTGRES_DB: fund_engine
      POSTGRES_USER: fund_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fund_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fund_user -d fund_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: fund-engine-api
    environment:
      DATABASE_URL: postgresql://fund_user:${DB_PASSWORD:-fund_password}@postgres:5432/fund_engine
      SCORING_CONFIG_PATH: /app/config/scoring_config.yaml
      RULES_CONFIG_PATH: /app/config/rules.yaml
      BENCHMARK_MAPPINGS_PATH: /app/config/explicit_benchmark_mappings.json
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  batch:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: fund-engine-batch
    environment:
      DATABASE_URL: postgresql://fund_user:${DB_PASSWORD:-fund_password}@postgres:5432/fund_engine
      SCORING_CONFIG_PATH: /app/config/scoring_config.yaml
      RULES_CONFIG_PATH: /app/config/rules.yaml
      BENCHMARK_MAPPINGS_PATH: /app/config/explicit_benchmark_mappings.json
    entrypoint: []
    command: ["python", "scripts/run_nightly.py"]
    depends_on:
      postgres:
        condition: service_healthy
    # One-off: docker compose run --rm batch --date 2026-10-27

volumes:
  postgres_data:

networks:
  default:
    name: fund-engine-network
