# GitHub Actions - CI for the Fund Engine monorepo
#
# Deployment is handled by the platforms' Git integrations:
#   - apps/web  -> Vercel (root directory: apps/web)
#   - apps/api  -> Railway (root directory: apps/api; API + batch services)
#
# This workflow only verifies code. It never deploys.

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # BACKEND - lint/tests/e2e
  # ============================================================
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r api/requirements.txt

      - name: Run test suite
        run: |
          python -m pytest resolution/ ingestion/ features/ rules/ scoring/ db/ api/ scripts/ test_e2e_pipeline.py -q

      - name: Run end-to-end pipeline
        run: python test_e2e_pipeline.py

      - name: Check formatting (informational)
        continue-on-error: true
        run: |
          pip install black isort
          black --check .
          isort --check-only .

  # ============================================================
  # FRONTEND - Vercel-equivalent production build
  # ============================================================
  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_USE_MOCK_API: 'false'
        run: npm run build

  # ============================================================
  # BACKEND IMAGE - proves the Railway/Dockerfile build works
  # ============================================================
  docker:
    name: Docker image
    needs: api
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: fund-engine-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # MIGRATIONS - idempotent runner tracks applied files
  # ============================================================
  migrate-db:
    name: Apply database migrations
    needs: api
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set - skipping migrations."
            exit 0
          fi
          python scripts/apply_migrations.py
