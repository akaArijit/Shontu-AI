# GitHub Actions - CI/CD Pipeline for MFD Fund Monitoring

name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # ============================================================
  # TESTS
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r api/requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest resolution/ ingestion/ features/ rules/ scoring/ -v --tb=short

      - name: Run integration test
        run: |
          python test_e2e_pipeline.py

      - name: Check code formatting (informational)
        continue-on-error: true
        run: |
          pip install black isort
          black --check .
          isort --check-only .

  # ============================================================
  # DOCKER BUILD
  # ============================================================
  docker-build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # DEPLOY TO RAILWAY
  # Recommended: connect each Railway service to this repo (Settings →
  # Source) and let Railway auto-deploy on push to the tracked branch.
  # The CLI jobs below are optional; set repo variable
  # RAILWAY_CLI_DEPLOY=true (plus RAILWAY_TOKEN secret) to use them.
  # ============================================================
  deploy-api:
    name: Deploy API to Railway (optional)
    needs: docker-build
    if: github.ref == 'refs/heads/master' && vars.RAILWAY_CLI_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy API service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_API_SERVICE }}
        run: npx --yes @railway/cli up --ci --service "$RAILWAY_SERVICE"

  # ============================================================
  # DEPLOY BATCH / CRON SERVICE TO RAILWAY
  # ============================================================
  deploy-batch:
    name: Deploy Batch Job to Railway (optional)
    needs: docker-build
    if: github.ref == 'refs/heads/master' && vars.RAILWAY_CLI_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy batch service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_BATCH_SERVICE }}
        run: npx --yes @railway/cli up --ci --service "$RAILWAY_SERVICE"

  # ============================================================
  # DEPLOY FRONTEND TO RAILWAY
  # ============================================================
  deploy-frontend:
    name: Deploy Frontend to Railway (optional)
    needs: docker-build
    if: github.ref == 'refs/heads/master' && vars.RAILWAY_CLI_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy frontend service
        working-directory: ./frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_FRONTEND_SERVICE }}
        run: npx --yes @railway/cli up --ci --service "$RAILWAY_SERVICE"

  # ============================================================
  # DATABASE MIGRATIONS
  # ============================================================
  migrate-db:
    name: Run Database Migrations
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for migration in db/migrations/*.sql; do
            echo "Running $migration"
            psql "$DATABASE_URL" -f "$migration"
          done

  # ============================================================
  # NOTIFICATIONS
  # ============================================================
  notify:
    name: Send Notification
    needs: [deploy-api, deploy-batch, deploy-frontend, migrate-db]
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: "MFD Fund Monitoring ${{ job.status }} - ${{ github.ref }}"